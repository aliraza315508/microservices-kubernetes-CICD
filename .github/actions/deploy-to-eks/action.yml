name: Deploy to EKS dev
description: Deploy only the services listed in Workflow B deployment metadata

inputs:
  eks_cluster_name:
    description: Name of the EKS cluster
    required: true

  k8s_namespace:
    description: Kubernetes namespace
    required: true

  deployment_metadata_file:
    description: Path to the deployment metadata JSON file downloaded from Workflow B
    required: true

outputs:
  full_sha:
    description: Full commit SHA used for deployment

  short_sha:
    description: Short 7-character SHA used for deployment

  image_tag:
    description: Docker image tag used for deployment

  deployed_services:
    description: Comma-separated list of services deployed

runs:
  using: node20
  main: index.js