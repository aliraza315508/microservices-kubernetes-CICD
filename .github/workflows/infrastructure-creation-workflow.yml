name: Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

      stack:
        description: "Terraform stack to run"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - all
          - vpc
          - database
          - eks
          - workflow-b

  push:
    branches:
      - main
    paths:
      - "terraform/vpc/**"
      - "terraform/database/**"
      - "terraform/eks/**"
      - "terraform/workflow-b/**"
      - ".github/actions/run-terraform-infrastructure/**"
      - ".github/workflows/infrastructure-creation-workflow.yml"

permissions:
  contents: read

concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.9.8

  TF_VAR_terraform_state_bucket_name: ${{ secrets.TERRAFORM_STATE_BUCKET_NAME }}
  TF_VAR_terraform_lock_table_name: ${{ secrets.TERRAFORM_LOCK_TABLE_NAME }}

  TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

jobs:
  terraform-infrastructure:
    name: Run Terraform Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install run-terraform-infrastructure dependencies
        working-directory: ./.github/actions/run-terraform-infrastructure
        run: npm ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.TERRAFORM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TERRAFORM_AWS_SECRET_ACCESS_KEY }}

      - name: Run Terraform infrastructure action
        id: terraform
        uses: ./.github/actions/run-terraform-infrastructure
        with:
          action: ${{ github.event_name == 'push' && 'plan' || inputs.action }}
          stack: ${{ github.event_name == 'push' && 'auto' || inputs.stack }}
          terraform_state_bucket_name: ${{ secrets.TERRAFORM_STATE_BUCKET_NAME }}
          terraform_lock_table_name: ${{ secrets.TERRAFORM_LOCK_TABLE_NAME }}

      - name: Show Terraform infrastructure summary
        run: |
          echo "Final action: ${{ steps.terraform.outputs.final_action }}"
          echo "Selected stacks: ${{ steps.terraform.outputs.selected_stacks }}"
          echo "Should run: ${{ steps.terraform.outputs.should_run }}"