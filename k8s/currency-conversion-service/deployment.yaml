apiVersion: apps/v1
kind: Deployment

metadata:
  name: currency-conversion-service
  namespace: currency-system
  labels:
    app: currency-conversion-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: currency-conversion-service

  template:
    metadata:
      labels:
        app: currency-conversion-service

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: currency-conversion-service

      volumes:
        - name: tmp-volume
          emptyDir: {}

      containers:
        - name: currency-conversion-service
          image: currency-conversion-service:placeholder
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

          ports:
            - containerPort: 8100

          env:
            - name: SERVER_PORT
              value: "8100"

            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE


          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8100
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8100
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8100
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5