apiVersion: apps/v1
kind: Deployment

metadata:
  name: naming-server
  namespace: currency-system
  labels:
    app: naming-server

spec:
  replicas: 1

  selector:
    matchLabels:
      app: naming-server

  template:
    metadata:
      labels:
        app: naming-server

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: tmp-volume
          emptyDir: {}

      containers:
        - name: naming-server
          image: naming-server:placeholder
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

          ports:
            - containerPort: 8761

          env:
            - name: SERVER_PORT
              value: "8761"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"

          startupProbe:
            tcpSocket:
              port: 8761
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5