apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: currency-exchange-service-hpa
  namespace: currency-system
  labels:
    app: currency-exchange-service

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: currency-exchange-service

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70