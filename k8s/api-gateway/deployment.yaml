apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: currency-system
  labels:
    app: api-gateway

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: api-gateway:placeholder
          imagePullPolicy: Always


          ports:
            - containerPort: 8765

          env:
            - name: SERVER_PORT
              value: "8765"

            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE



          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              port: 8765
              path: /actuator/health
            initialDelaySeconds: 25
            periodSeconds: 10


          livenessProbe:
            httpGet:
              port: 8765
              path: /actuator/health
            initialDelaySeconds: 45
            periodSeconds: 20